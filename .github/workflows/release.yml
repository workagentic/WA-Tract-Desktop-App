name: Build & Release Desktop App

# GitHub Actions workflow whenever you push a Git tag matching v1.2.3 format.
on:
  push:
    tags:
      - 'v*.*.*'

# Required so the default GITHUB_TOKEN is allowed to create/publish a GitHub
# Release (the gh CLI publish step below) instead of failing with a 403.
permissions:
  contents: write

jobs:
  release:
    # Windows only for now — matches electron-builder's "win" target below
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5 # now workflow can access the source code, now ubuntu-latest machine can access code

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # Windows Defender's real-time scanner on windows-latest runners is
      # known to quarantine/delete freshly-built unsigned NSIS installers a
      # few seconds after they're written (electron-builder is unsigned here
      # - no CSC_LINK configured). That's why v1.0.0's release had the
      # .blockmap (computed right after build) but not the .exe itself
      # (deleted before the publish step could upload it), with no build
      # failure to show for it - and it happened AGAIN for v1.0.9 (this time
      # the build step itself failed outright rather than silently
      # succeeding without the exe) even with just the exclusion path below,
      # so that alone isn't reliably enough - disabling real-time monitoring
      # outright for the build is the more aggressive, more commonly used
      # mitigation for this exact class of CI/Defender interaction.
      - name: Exclude workspace from Windows Defender
        shell: powershell
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Write .env.production
        run: echo "API_BASE_URL=${{ vars.API_BASE_URL }}" > .env.production

      # electron-builder only packages what's already in out/ — it doesn't
      # compile the app itself. out/ is gitignored (never in the checkout),
      # so without this the asar gets built with nothing in it ("main.js
      # was not found in this archive").
      - name: Compile app (main/preload/renderer)
        run: npm run build

      # NOT --publish - electron-builder's own GitHub-upload step has
      # repeatedly (v1.0.0, v1.0.3, v1.0.4, v1.0.9) uploaded the tiny
      # .blockmap/latest.yml successfully while silently dropping the actual
      # installer (~105MB) with no error - a known electron-builder/GitHub
      # large-asset-upload reliability issue, not something retrying
      # electron-builder fixes. Build locally here; publish separately below
      # via the gh CLI, which has far more battle-tested handling of large
      # binary uploads in CI.
      - name: Build (Windows)
        run: npx electron-builder --win

      # electron-builder can exit 0 even if the installer itself was never
      # actually produced. Fail the job loudly rather than publishing a
      # release silently missing its main asset, whatever the cause.
      - name: Verify installer was actually built
        shell: bash
        run: |
          FILE=$(find release -maxdepth 1 -name '*.exe' ! -name '*.blockmap' | head -n1)
          if [ -z "$FILE" ] || [ ! -s "$FILE" ]; then
            echo "::error::No non-empty installer .exe found in release/ - aborting."
            exit 1
          fi
          echo "Installer present: $FILE ($(stat -c%s "$FILE") bytes)"

      # Delete any stale release for this exact tag first (e.g. left over
      # from a prior failed run that got as far as creating the release
      # object) - `gh release create` fails outright if one already exists.
      # `--cleanup-tag` is deliberately omitted: only the release object
      # should go, never the tag that triggered this run.
      - name: Publish release (gh CLI)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" \
            release/*.exe release/*.exe.blockmap release/latest.yml \
            --title "$TAG" --generate-notes

      # The build-verification step above only proves the LOCAL build
      # produced a real file - it says nothing about whether the upload
      # actually landed it on GitHub. Refuse to let that go unnoticed: query
      # the release for this exact tag (which reliably resolves to the real
      # one, unlike /releases/latest when a duplicate exists) and fail
      # loudly if the real .exe isn't actually there.
      - name: Verify the published release actually has the installer
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          RESPONSE=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG")
          if ! echo "$RESPONSE" | grep -qE '"name":[[:space:]]*"[^"]*\.exe"'; then
            echo "::error::Release $TAG has no .exe asset on GitHub, even though the local build succeeded - the upload silently failed. Failing the job so this can't go live broken and unnoticed."
            exit 1
          fi
          echo "Verified: release $TAG has a real .exe asset on GitHub."
